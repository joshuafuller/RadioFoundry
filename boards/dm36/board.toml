id = "dm36"
name = "Baofeng DM-36"
maker = "Baofeng"
model = "DM-36"
also = ["DM36UV", "DM36PRO", "DM36 PLUS", "DM36Ultra", "MD36UV", "AT36D", "GT36D"]
kind = "handheld"
order = 20

[docs]
hardware = "docs/spec/hardware-dm36.md"

[hardware]
bands = "136-174 / 400-470 MHz rated; build receive only"
power = "4.4 W VHF / 4.1 W UHF (FCC); TX disabled in build"
display = "2.0 inch 240x320 color, ST7789-class"
# Shared renderer; bezel-safe insets remain unverified.
gallery = "240x320i10x5"
clock = { rtc = "backed", note = "RTC coin cell visible in the board photo; wiring unverified" }

[status]
level = "bring-up"
summary = "Built, never run on a radio. Spec-based wiring, display and application base; codec layout and calibration unverified; transmit disabled."
release = "testing"

# No release container or supported codec source is established.
[flash]
family = "serial-loader"
keep_codec = false
stock_versions = []
backup = { stock = "none", rfoundry = "none", spi_size = 0x1000000 }
notice = "Build only. Do not flash: codec layout, update container and recovery are unverified."

[flash.bootloader]
keys = "PTT + SK1 (reported)"
steps = ["Build only: do not flash; the update container and recovery are unverified."]
id = "BFUV36-V1"

# The universal HR_C7000 stub's board profile: the radio's backup was read through it (hardware-dm36.md 2); no
# data flash write test region until a writable area is established (hardware-dm36.md 10)
[flash.stub]
id = 4
hold_power = false
progmem = 0x100000
tested = false
# assumed from the shared translation layer (hardware-dm36.md 10); read only, unconfirmed on a DM-36
calibration = { area = 0xC9000, page_id = 2 }

[codec]
tool = "hrc7000_codec"
profile = "dm36-unverified"
sources = []

[frame]
shape = "handheld-tall"
body = "#22252a"
accent = "#e0a526"
lens = [24, 34]
