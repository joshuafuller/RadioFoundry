<text x="40" y="744" class="note" text-anchor="start">Dashed outlines: host processes. Channel arrows: grants and inputs out; traces and results back.</text>
<text x="40" y="771" class="note" text-anchor="start">Modeled bursts pass through the conductor. Board models supply screen, keys, storage, modem and audio.</text>
<text x="40" y="796" class="code" text-anchor="start">Host execution only; optional firmware emulators are described separately. No physical RF is involved.</text>
