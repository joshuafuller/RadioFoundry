<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="808" viewBox="0 0 1280 808" role="img" aria-labelledby="title description">
<title id="title">Host virtual-radio architecture</title>
<desc id="description">Test scripts use the debug link multiplexer, browsers use the web gateway, and scenario runners use the world API. All three enter one conductor process. Its world controller coordinates virtual time, simulated air, inputs and faults, with a recorder and audit log. Separate bidirectional channels connect two independent radio processes. Each runs a host runtime, the firmware's own tasks and HAL interfaces backed by a virtual board. Radios exchange modeled bursts through the conductor. No physical RF is involved.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#31546b"/></marker>
  <style>
    text { font-family: 'IBM Plex Sans', 'DejaVu Sans', sans-serif; fill: #172c3a; }
    .title { font-size: 28px; font-weight: 600; }
    .label { font-size: 19px; font-weight: 600; }
    .body { font-size: 17px; }
    .note { font-size: 15px; fill: #4b626f; }
    .code { font-family: 'IBM Plex Mono', 'DejaVu Sans Mono', monospace; font-size: 14px; fill: #4b626f; }
    .section { font-family: 'IBM Plex Mono', 'DejaVu Sans Mono', monospace; font-size: 15px; fill: #246482; letter-spacing: 1px; }
    .wire { fill: none; stroke: #31546b; stroke-width: 1.6; stroke-linejoin: miter; }
    .rule { stroke: #c8d3da; stroke-width: 1; }
  </style>
</defs>
