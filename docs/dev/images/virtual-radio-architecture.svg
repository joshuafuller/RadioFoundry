<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1220" viewBox="0 0 1160 1220" role="img" aria-labelledby="title description">
  <title id="title">Virtual radio: clients, one conductor, independent radio processes</title>
  <desc id="description">Test scripts and HIL scripts use the debug link multiplexer. The browser uses the web gateway. Scenario runners use the world API. These interfaces enter one conductor, which owns time, shared simulated air, faults and control permissions, and records inputs and results. Each radio has a separate bidirectional channel and process containing the host runtime, the firmware's own tasks, unchanged HAL interfaces and a virtual board. Radios exchange modeled bursts through the conductor, never directly or through physical RF. This diagram covers host execution, not the optional firmware emulators.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#64748b"/></marker>
    <style>
      text { font-family: Inter, 'DejaVu Sans', Arial, sans-serif; fill: #172b40; }
      .eyebrow { font-size: 15px; font-weight: 700; letter-spacing: 1.5px; fill: #42627c; }
      .heading { font-size: 36px; font-weight: 700; letter-spacing: -0.6px; }
      .label { font-size: 21px; font-weight: 700; }
      .body { font-size: 18px; fill: #40576d; }
      .small { font-size: 16px; fill: #40576d; }
      .wire { fill: none; stroke: #64748b; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1160" height="1220" rx="24" fill="#f5f8fc"/>

<text x="48" y="45" class="eyebrow" text-anchor="start">VIRTUAL RADIO / HOST EXECUTION</text>
<text x="48" y="94" class="heading" text-anchor="start">One world. Independent radio processes.</text>
<text x="48" y="126" class="body" text-anchor="start">The same firmware tasks, with controlled time and modeled hardware.</text>
